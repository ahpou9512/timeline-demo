<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Timeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      padding: 40px 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 1.6rem;
      color: #1a1a2e;
    }

    .timeline {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Vertical line */
    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #c8d6e5;
      border-radius: 2px;
    }

    .event {
      position: relative;
      margin-bottom: 32px;
      padding-left: 56px;
    }

    /* Dot on the line */
    .event::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 14px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4a90d9;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #4a90d9;
    }

    .event.done::before  { background: #27ae60; box-shadow: 0 0 0 2px #27ae60; }
    .event.warn::before  { background: #e67e22; box-shadow: 0 0 0 2px #e67e22; }
    .event.alert::before { background: #e74c3c; box-shadow: 0 0 0 2px #e74c3c; }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.15s;
    }

    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }

    .card .date {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card .title {
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    .card .desc {
      font-size: 0.875rem;
      color: #555;
      margin-top: 6px;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge.done  { background: #eafaf1; color: #27ae60; }
    .badge.warn  { background: #fef5e7; color: #e67e22; }
    .badge.alert { background: #fdedec; color: #e74c3c; }
    .badge.info  { background: #eaf3fb; color: #4a90d9; }
  </style>
</head>
<body>

  <h1>Project Timeline</h1>

  <div class="timeline" id="timeline"></div>

  <script>
    const events = [
      {
        date: 'Jan 10, 2026',
        title: 'Project Kickoff',
        desc: 'Initial meeting with stakeholders. Scope and goals defined.',
        type: 'done',
        badge: 'Completed'
      },
      {
        date: 'Feb 3, 2026',
        title: 'Design Phase',
        desc: 'Wireframes and mockups approved by the client.',
        type: 'done',
        badge: 'Completed'
      },
      {
        date: 'Mar 15, 2026',
        title: 'Development Sprint 1',
        desc: 'Core features implemented. Authentication and dashboard ready.',
        type: 'done',
        badge: 'Completed'
      },
      {
        date: 'Apr 20, 2026',
        title: 'Development Sprint 2',
        desc: 'API integrations and reporting module in progress.',
        type: 'warn',
        badge: 'In Progress'
      },
      {
        date: 'May 30, 2026',
        title: 'QA & Testing',
        desc: 'Full regression testing and user acceptance testing.',
        type: 'info',
        badge: 'Upcoming'
      },
      {
        date: 'Jun 15, 2026',
        title: 'Launch',
        desc: 'Production deployment and go-live.',
        type: 'alert',
        badge: 'Deadline'
      }
    ];

    const container = document.getElementById('timeline');

    events.forEach(ev => {
      container.innerHTML += `
        <div class="event ${ev.type}">
          <div class="card">
            <div class="date">${ev.date}</div>
            <div class="title">${ev.title}</div>
            <div class="desc">${ev.desc}</div>
            <span class="badge ${ev.type}">${ev.badge}</span>
          </div>
        </div>
      `;
    });
  </script>

</body>
</html>
